<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Police Station Tenure Tracker</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 1100px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a365d; margin-bottom: 20px; }
    .login-box { margin-bottom: 20px; text-align: center; }
    input[type="password"], input[type="text"] { padding: 10px 15px; width: 60%; max-width: 300px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    
    .filter-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
    .btn { padding: 10px 18px; color: white; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; font-weight: bold; transition: 0.2s; }
    .btn-login { background-color: #2b6cb0; }
    .btn-all { background-color: #4a5568; }
    .btn-3yr { background-color: #dd6b20; }
    .btn-4yr { background-color: #e53e3e; }
    .btn-5yr { background-color: #9b2c2c; }
    .btn:hover { opacity: 0.85; transform: translateY(-1px); }
    
    #statusMsg { text-align: center; font-weight: bold; margin: 15px 0; color: #2b6cb0; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; display: none; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; }
    th { background-color: #2b6cb0; color: white; }
    tr:nth-child(even) { background-color: #f7fafc; }
    .row-count { text-align: right; font-weight: bold; color: #2d3748; margin-top: 10px; }
  </style>
</head>
<body>

<div class="container">
  <h2>Police Station Tenure Tracker</h2>

  <div id="loginSection" class="login-box">
    <input type="password" id="userPassword" placeholder="પાસવર્ડ નાખો...">
    <button class="btn btn-login" onclick="login()">ઓપન કરો</button>
  </div>

  <div id="dashboardSection" style="display:none;">
    <div class="filter-container">
      <button class="btn btn-all" onclick="filterTenure(0)">📋 બધો જ ડેટા</button>
      <button class="btn btn-3yr" onclick="filterTenure(3)">⚠️ 3+ વર્ષવાળા</button>
      <button class="btn btn-4yr" onclick="filterTenure(4)">🚨 4+ વર્ષવાળા</button>
      <button class="btn btn-5yr" onclick="filterTenure(5)">🔥 5+ વર્ષ કે તેથી વધુ</button>
    </div>

    <div style="text-align: center; margin-bottom: 15px;">
      <input type="text" id="searchInput" onkeyup="searchTable()" placeholder="નામ, બકલ નં. કે હોદ્દો શોધો...">
    </div>

    <div id="rowCount" class="row-count"></div>
  </div>

  <div id="statusMsg"></div>

  <table id="dataTable">
    <thead><tr id="tableHeader"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
  // ⚠️ તમારી Tenure Google Sheet ની Web App URL અહીં મૂકો
  const API_URL = "https://script.google.com/macros/s/AKfycbysu-eBjalOMAI_l0c1wZSIUwHH_BrgTDe3KykAYzLnjTu0dE-lYYEeAuFF0S9eAD4/exec";

  let rawData = [];
  let psJoinDateIndex = -1; // PS JOIN DATE ની કોલમ નંબર શોધવા માટે

  async function login() {
    const userPassword = document.getElementById("userPassword").value.trim();
    const statusMsg = document.getElementById("statusMsg");
    
    if(!userPassword) {
      alert("મહેરબાની કરીને પાસવર્ડ નાખો!");
      return;
    }

    statusMsg.style.display = "block";
    statusMsg.style.color = "#2b6cb0";
    statusMsg.innerHTML = "⏳ ડેટા લોડ થઈ રહ્યો છે...";

    try {
      const fetchUrl = API_URL + "?pass=" + encodeURIComponent(userPassword);
      const response = await fetch(fetchUrl);
      const result = await response.json();

      if (result.status === "success" && result.data && result.data.length > 0) {
        rawData = result.data;
        
        // PS JOIN DATE કઈ કોલમમાં છે તે શોધી લેશે (E કોલમ = Index 4)
        const headers = rawData[0];
        psJoinDateIndex = headers.findIndex(h => h.toString().toUpperCase().includes("PS JOIN DATE"));
        if (psJoinDateIndex === -1) psJoinDateIndex = 4; // જો ન મળે તો ડિફોલ્ટ E કોલમ

        statusMsg.style.display = "none";
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("dashboardSection").style.display = "block";
        document.getElementById("dataTable").style.display = "table";
        
        filterTenure(0);
      } else {
        statusMsg.style.color = "red";
        statusMsg.innerHTML = "❌ ખોટો પાસવર્ડ અથવા ડેટા મળ્યો નથી!";
      }
    } catch (error) {
      console.error(error);
      statusMsg.style.color = "red";
      statusMsg.innerHTML = "❌ કનેક્શનમાં ભૂલ આવી! કૃપા કરીને Apps Script ની લિંક ચેક કરો.";
    }
  }

  function filterTenure(minYears) {
    const headerRow = document.getElementById("tableHeader");
    const bodyRows = document.getElementById("tableBody");
    headerRow.innerHTML = "";
    bodyRows.innerHTML = "";

    if (!rawData || rawData.length === 0) return;

    // Header Set
    rawData[0].forEach(header => {
      const th = document.createElement("th");
      th.innerText = header;
      headerRow.appendChild(th);
    });

    let matchedCount = 0;

    for (let i = 1; i < rawData.length; i++) {
      const row = rawData[i];
      const joinDateCell = row[psJoinDateIndex]; // ફક્ત PS JOIN DATE ની જ ગણતરી થશે
      const yearsServed = calculateYears(joinDateCell);

      if (minYears === 0 || yearsServed >= minYears) {
        const tr = document.createElement("tr");
        row.forEach((cell, idx) => {
          const td = document.createElement("td");
          // જો તારીખ હોય તો યોગ્ય ફોર્મેટમાં બતાવશે
          if (idx === psJoinDateIndex && cell) {
            const d = parseGujDate(cell);
            td.innerText = d ? d.toLocaleDateString('en-GB') : cell;
          } else {
            td.innerText = cell;
          }
          tr.appendChild(td);
        });
        bodyRows.appendChild(tr);
        matchedCount++;
      }
    }

    document.getElementById("rowCount").innerText = "કુલ કર્મચારીઓ: " + matchedCount;
  }

  // DD/MM/YYYY તારીખમાંથી વર્ષ ગણવાનું ખાસ ફંક્શન
  function calculateYears(dateStr) {
    if (!dateStr) return 0;
    const parsedDate = parseGujDate(dateStr);
    if (!parsedDate) return 0;

    const today = new Date();
    const diffTime = today - parsedDate;
    const diffYears = diffTime / (1000 * 60 * 60 * 24 * 365.25);
    return diffYears > 0 ? diffYears : 0;
  }

  function parseGujDate(dateStr) {
    if (dateStr instanceof Date) return dateStr;
    const str = dateStr.toString().trim();
    
    // DD/MM/YYYY અથવા DD-MM-YYYY સપોર્ટ માટે
    const parts = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
    if (parts) {
      return new Date(parts[3], parts[2] - 1, parts[1]);
    }

    const isoDate = Date.parse(str);
    if (!isNaN(isoDate)) return new Date(isoDate);

    return null;
  }

  function searchTable() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const rows = document.querySelectorAll("#tableBody tr");

    rows.forEach(row => {
      const text = row.innerText.toLowerCase();
      row.style.display = text.includes(input) ? "" : "none";
    });
  }
</script>

</body>
</html>
