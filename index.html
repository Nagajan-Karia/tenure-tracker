<!DOCTYPE html>
<html lang="gu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Police Station Tenure Tracker</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #1a365d; margin-bottom: 20px; }
    .login-box, .search-box { margin-bottom: 20px; text-align: center; }
    input[type="password"], input[type="text"] { padding: 10px 15px; width: 60%; max-width: 300px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
    button { padding: 10px 20px; background-color: #2b6cb0; color: white; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-left: 10px; }
    button:hover { background-color: #2c5282; }
    #statusMsg { text-align: center; font-weight: bold; margin: 15px 0; color: #2b6cb0; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; display: none; }
    th, td { border: 1px solid #e2e8f0; padding: 12px; text-align: left; }
    th { background-color: #2b6cb0; color: white; }
    tr:nth-child(even) { background-color: #f7fafc; }
  </style>
</head>
<body>

<div class="container">
  <h2>Police Station Tenure Tracker</h2>

  <!-- Login Section -->
  <div id="loginSection" class="login-box">
    <input type="password" id="userPassword" placeholder="પાસવર્ડ નાખો...">
    <button onclick="login()">ઓપન કરો</button>
  </div>

  <!-- Search Section -->
  <div id="searchSection" class="search-box" style="display:none;">
    <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="નામ કે વિગત શોધો...">
  </div>

  <div id="statusMsg"></div>

  <!-- Data Table -->
  <table id="dataTable">
    <thead><tr id="tableHeader"></tr></thead>
    <tbody id="tableBody"></tbody>
  </table>
</div>

<script>
  // તમારી નવી Apps Script Web App URL અહીં નીચે અવતરણ ચિહ્નો (" ") ની વચ્ચે મુકો
  const API_URL = "https://script.google.com/macros/s/AKfycbwFRshQs8oQQfSS873BvLjU2ff3SWDph2gaxmVLw8weMfnPZCSs4QiG-dFNKxg-MY_SUg/exec";

  let allData = [];

  async function login() {
    const userPassword = document.getElementById("userPassword").value;
    const statusMsg = document.getElementById("statusMsg");
    
    if(!userPassword) {
      alert("મહેરબાની કરીને પાસવર્ડ નાખો!");
      return;
    }

    statusMsg.style.display = "block";
    statusMsg.innerHTML = "⏳ ડેટા લોડ થઈ રહ્યો છે...";

    try {
      const response = await fetch(${API_URL}?pass=${encodeURIComponent(userPassword)});
      const result = await response.json();

      if (result.status === "success" && result.data.length > 0) {
        allData = result.data;
        renderTable(allData);
        statusMsg.style.display = "none";
        document.getElementById("dataTable").style.display = "table";
        document.getElementById("loginSection").style.display = "none";
        document.getElementById("searchSection").style.display = "block";
      } else {
        statusMsg.style.color = "red";
        statusMsg.innerHTML = "❌ ખોટો પાસવર્ડ! એક્સેસ ના મંજૂર.";
      }
    } catch (error) {
      console.error(error);
      statusMsg.style.color = "red";
      statusMsg.innerHTML = "❌ ડેટા લોડ કરવામાં ભૂલ આવી. કૃપા કરીને ફરી પ્રયાસ કરો.";
    }
  }

  function renderTable(data) {
    const headerRow = document.getElementById("tableHeader");
    const bodyRows = document.getElementById("tableBody");
    headerRow.innerHTML = "";
    bodyRows.innerHTML = "";

    // Set Headers
    data[0].forEach(header => {
      const th = document.createElement("th");
      th.innerText = header;
      headerRow.appendChild(th);
    });

    // Set Rows
    for (let i = 1; i < data.length; i++) {
      const tr = document.createElement("tr");
      data[i].forEach(cell => {
        const td = document.createElement("td");
        td.innerText = cell;
        tr.appendChild(td);
      });
      bodyRows.appendChild(tr);
    }
  }

  function filterTable() {
    const input = document.getElementById("searchInput").value.toLowerCase();
    const rows = document.querySelectorAll("#tableBody tr");

    rows.forEach(row => {
      const text = row.innerText.toLowerCase();
      row.style.display = text.includes(input) ? "" : "none";
    });
  }
</script>

</body>
</html>
